<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rabbit emotions</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#080d17;color:#dff8ff;font:15px system-ui}header{max-width:1400px;margin:auto auto 24px}h1{margin:0 0 8px;font-size:28px}p{color:#91a9bd}button,a{color:#bceeff;background:#102536;border:1px solid #28506a;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1400px;margin:auto}article{background:#000;border:1px solid #193246;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;aspect-ratio:5/3}footer{padding:12px 16px;display:flex;align-items:center;justify-content:space-between}h2{font-size:15px;font-weight:500;text-transform:capitalize;margin:0}@media(max-width:900px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{grid-template-columns:1fr}body{padding:16px}}</style>
<header><h1>Rabbit emotions</h1><p>Ten expressions. The same little companion.</p><button id="motion">Pause motion</button></header><main id="gallery"></main>
<script src="/face.js"></script><script src="/expressive.js"></script><script src="/rabbit.js"></script><script>
const faces=[];let moving=!matchMedia('(prefers-reduced-motion: reduce)').matches;
Face.NAMES.forEach(name=>{const card=document.createElement('article');const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=600;canvas.setAttribute('aria-label',name+' rabbit expression');const footer=document.createElement('footer');const title=document.createElement('h2');title.textContent=name;const link=document.createElement('a');link.href='/?emote='+name+'&link=0&bare=1';link.textContent='Open face';footer.append(title,link);card.append(canvas,footer);document.querySelector('main').append(card);const face=new RabbitFace(canvas,{idle:moving});face.setEmote(name,0);face.t=1;face.start();faces.push(face)});
const button=document.querySelector('button');button.textContent=moving?'Pause motion':'Play motion';button.onclick=()=>{moving=!moving;faces.forEach(face=>{face.idleOn=moving;face.reducedMotion=!moving;face.blinkT=-1;face.t=1});button.textContent=moving?'Pause motion':'Play motion'};
</script></html>
